[project]
name = "preflop-solveur"
version = "0.1.0"
description = "Solveur préflop Expresso 3-max (moteur + API)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numba>=0.68.1",
    "numpy",
]

[project.scripts]
engine = "engine.cli:main"

[dependency-groups]
dev = [
    "hypothesis",
    "httpx",
    "mypy",
    "pytest",
    "pytest-benchmark",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["engine", "api"]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

# Numba kernels (decision D-010): compiled code works on untyped scalars and
# arrays. Only these modules are relaxed; their Python entry points stay typed.
[[tool.mypy.overrides]]
module = ["engine.evaluator.kernel", "engine.equity._kernels"]
warn_return_any = false
disallow_untyped_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "-m", "not slow"]
markers = [
    "slow: long exhaustive checks, excluded by default (run with `uv run pytest -m slow`)",
]
