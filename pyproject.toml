[project]
name = "preflop-solveur"
version = "0.1.0"
description = "Solveur préflop Expresso 3-max (moteur + API)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
]

[dependency-groups]
dev = [
    "hypothesis",
    "httpx",
    "mypy",
    "pytest",
    "pytest-benchmark",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["engine", "api"]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
