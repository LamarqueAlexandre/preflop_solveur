name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"

      - name: Installer les dépendances
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Typage du moteur
        run: uv run mypy engine/

      - name: Tests
        run: uv run pytest

      - name: Tests lents (vérifications exhaustives)
        run: uv run pytest -m slow
